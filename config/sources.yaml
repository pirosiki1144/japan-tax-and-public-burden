      "enabled": true,
      "automation_enabled": true,
      "monitoring_tax_ids": ["employment-insurance-premium"],
      "adapter": "pdf_regex_facts",
      "accepted_content_types": ["application/pdf"],
      "extraction": {
        "expected_pages": 1,
        "required_markers": [
          {"page_index":0,"label":"fiscal application period","pattern":"2026[^0-9]+0?4[^0-9]+0?1[^0-9]+.*2027[^0-9]+0?3[^0-9]+31"},
          {"page_index":0,"label":"general business rates","pattern":"5/1,0008\\.5/1,0005/1,0003\\.5/1,00013\\.5/1,000"},
          {"page_index":0,"label":"agriculture rates","pattern":"6/1,0009\\.5/1,0006/1,0003\\.5/1,00015\\.5/1,000"},
          {"page_index":0,"label":"construction rates","pattern":"6/1,00010\\.5/1,0006/1,0004\\.5/1,00016\\.5/1,000"}
        ],
        "facts": [
          {"fact_id":"employment-period-start","page_index":0,"pattern":"(2026)[^0-9]+(0?4)[^0-9]+(0?1)","capture_group":1,"transform":"iso_date_components","expected_value":"2026-04-01"},
          {"fact_id":"employment-period-end","page_index":0,"pattern":"(2027)[^0-9]+(0?3)[^0-9]+(31)","capture_group":1,"transform":"iso_date_components","expected_value":"2027-03-31"},
          {"fact_id":"employment-general-worker","page_index":0,"pattern":"[^0-9.]([0-9.]+)/1,0008\\.5/1,0005/1,0003\\.5/1,00013\\.5/1,000","capture_group":1,"transform":"number","expected_value":5},
          {"fact_id":"employment-general-employer","page_index":0,"pattern":"5/1,000([0-9.]+)/1,0005/1,0003\\.5/1,00013\\.5/1,000","capture_group":1,"transform":"number","expected_value":8.5},
          {"fact_id":"employment-general-total","page_index":0,"pattern":"5/1,0008\\.5/1,0005/1,0003\\.5/1,000([0-9.]+)/1,000","capture_group":1,"transform":"number","expected_value":13.5},
          {"fact_id":"employment-agriculture-worker","page_index":0,"pattern":"[^0-9.]([0-9.]+)/1,0009\\.5/1,0006/1,0003\\.5/1,00015\\.5/1,000","capture_group":1,"transform":"number","expected_value":6},
          {"fact_id":"employment-agriculture-employer","page_index":0,"pattern":"6/1,000([0-9.]+)/1,0006/1,0003\\.5/1,00015\\.5/1,000","capture_group":1,"transform":"number","expected_value":9.5},
          {"fact_id":"employment-agriculture-total","page_index":0,"pattern":"6/1,0009\\.5/1,0006/1,0003\\.5/1,000([0-9.]+)/1,000","capture_group":1,"transform":"number","expected_value":15.5},
          {"fact_id":"employment-construction-worker","page_index":0,"pattern":"[^0-9.]([0-9.]+)/1,00010\\.5/1,0006/1,0004\\.5/1,00016\\.5/1,000","capture_group":1,"transform":"number","expected_value":6},
          {"fact_id":"employment-construction-employer","page_index":0,"pattern":"6/1,000([0-9.]+)/1,0006/1,0004\\.5/1,00016\\.5/1,000","capture_group":1,"transform":"number","expected_value":10.5},
          {"fact_id":"employment-construction-total","page_index":0,"pattern":"6/1,00010\\.5/1,0006/1,0004\\.5/1,000([0-9.]+)/1,000","capture_group":1,"transform":"number","expected_value":16.5}
        ]
      },
      "rate_limit": "サイトの利用条件に従う",
      "terms_url": "https://www.mhlw.go.jp/chosakuken/index.html",
      "last_verified_at": "2026-08-21T06:34:11+09:00",
      "notes": "固定年度PDFの内容を年次監視する。令和8年4月1日から令和9年3月31日まで。次年度PDF URLへの切替は公式一覧ページを年次手動確認してconfigをレビューする。fixtureでは縮小PDFを使用する"
    },
