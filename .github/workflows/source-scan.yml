name: Scan official sources

on:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * 1"

permissions:
  contents: read

concurrency:
  group: official-source-update
  cancel-in-progress: false

jobs:
  coverage-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: plan
        run: echo "matrix=$(npm run --silent audit:coverage -- --matrix)" >> "$GITHUB_OUTPUT"
      - run: npm run audit:coverage -- --output .cache/adapter-coverage-all.json
      - uses: actions/upload-artifact@v4
        with:
          name: adapter-coverage-summary
          path: .cache/adapter-coverage-all.json
          if-no-files-found: error

  coverage-audit:
    needs: coverage-plan
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(needs.coverage-plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:coverage -- --batch "${{ matrix.batch }}" --output ".cache/adapter-coverage-${{ matrix.batch }}.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adapter-coverage-${{ matrix.batch }}
          path: .cache/adapter-coverage-${{ matrix.batch }}.json
          if-no-files-found: error

  scan:
    needs: coverage-audit
    if: always()
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.scan.outputs.has_changes }}
      has_findings: ${{ steps.scan.outputs.has_findings }}
      scan_failed: ${{ steps.scan.outputs.scan_failed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run inventory:check
      - run: npm run generate:check
      - run: npm run audit -- --output .cache/repository-audit.json
      - id: scan
        run: |
          set +e
          npm run monitor -- --output .cache/source-scan-result.json
          scan_exit=$?
          set -e
          npm run audit:scan -- --scan .cache/source-scan-result.json --report .cache/source-audit-report.json
          node -e 'const scan = require("./.cache/source-scan-result.json"); const audit = require("./.cache/source-audit-report.json"); process.stdout.write(`has_changes=${scan.routing?.has_changes === true}\nhas_findings=${audit.issue_candidates.length > 0}\nscan_failed=${scan.status === "error"}\n`)' >> "$GITHUB_OUTPUT"
          echo "scan_exit=$scan_exit"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-scan-result
          path: |
            .cache/source-scan-result.json
            .cache/source-audit-report.json
            .cache/repository-audit.json
          if-no-files-found: error
      - if: steps.scan.outputs.scan_failed == 'true'
        run: exit 1

  update-pr:
    needs: scan
    if: needs.scan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: source-scan-result
          path: .cache
      - run: npm ci
      - env:
          UPDATE_BRANCH: automation/official-source-updates
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$UPDATE_BRANCH"; then
            git fetch origin "$UPDATE_BRANCH"
            git switch --create "$UPDATE_BRANCH" --track "origin/$UPDATE_BRANCH"
            git merge --no-edit origin/main
          else
            git switch --create "$UPDATE_BRANCH" origin/main
          fi
          npm run prepare-update -- --scan .cache/source-scan-result.json --report .cache/update-pr-body.md
          npm run generate
          npm test
          npm run validate
          npm run generate:check
          npm run audit -- --output .cache/repository-audit-after-update.json
          if ! git diff --quiet; then
            git add data generated
            git commit -m "公式情報に基づくデータ更新候補"
          fi
          if git diff --quiet origin/main...HEAD; then
            echo "No candidate difference remains against main"
            exit 0
          fi
          git push --set-upstream origin "$UPDATE_BRANCH"
          existing_pr="$(gh pr list --state open --base main --head "$UPDATE_BRANCH" --json number --jq '.[0].number')"
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --body-file .cache/update-pr-body.md
          else
            gh pr create --base main --head "$UPDATE_BRANCH" --title "公式情報に基づくデータ更新候補" --body-file .cache/update-pr-body.md
          fi

  audit-issues:
    needs: scan
    if: always() && needs.scan.outputs.has_findings == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: source-scan-result
          path: .cache
      - env:
          GH_TOKEN: ${{ github.token }}
        run: npm run audit:issues -- --report .cache/source-audit-report.json
